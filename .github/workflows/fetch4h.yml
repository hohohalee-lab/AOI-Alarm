name: aoi-fetch-4h
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: unzip -qo aoi_alarm.zip -d _app
      - run: pip install pandas
      - run: python _app/aoi_alarm/research/fetch_ohlcv.py
      - name: Save
        run: |
          git config user.name aoi-bot; git config user.email aoi-bot@users.noreply.github.com
          git add research_data
          git diff --cached --quiet || (git commit -m "4h data" && git pull --rebase && git push)
